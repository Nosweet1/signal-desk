name: Fetch & Deploy Signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/fetch.mjs'
      - 'index.html'
      - '.github/workflows/fetch.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-desk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch public feeds
        run: node scripts/fetch.mjs

      - name: Persist latest data
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add data/feed.js
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: refresh signals [skip ci]"
            git push
          fi

      - name: Assemble site bundle
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/feed.js site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - uses: actions/deploy-pages@v4
