name: Fetch & Deploy Signals

on:
  schedule:
    # 云端抓取频率：改这一行即可。页面上的「刷新模式」只控制浏览器多久来取一次数据，不影响这里。
    # 想更及时可换 '*/15 * * * *'（约 400-600 分钟/月，仍在免费额度内）；每小时用 '0 * * * *'。
    - cron: '*/30 * * * *'
  # 在 GitHub Actions 页面点 Run workflow 可立即重抓一次，不必等定时
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/fetch.mjs'
      - 'index.html'
      - '.github/workflows/fetch.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch public feeds
        run: node scripts/fetch.mjs

      # 每日报：不调模型，用最近一期存档（daily.yml 负责每天调模型生成并提交存档）
      - name: Refresh daily brief from archive
        run: node scripts/daily.mjs --reuse-latest

      # 数据只在云端重新生成并随站点发布，不写回仓库：
      # 避免每半小时一个 commit 淹没历史，也避免并发任务互相 non-fast-forward
      - name: Assemble site bundle
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/feed.js site/data/
          [ -f data/daily.js ] && cp data/daily.js site/data/
          [ -d data/daily ] && mkdir -p site/data/daily && cp data/daily/*.json site/data/daily/
          cp manifest.json icon.svg sw.js site/
          cp .nojekyll site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
