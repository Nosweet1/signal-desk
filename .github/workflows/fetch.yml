name: Fetch & Deploy Signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/fetch.mjs'
      - 'index.html'
      - '.github/workflows/fetch.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: signal-desk-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch public feeds
        run: node scripts/fetch.mjs

      # 数据只在云端重新生成并随站点发布，不写回仓库：
      # 避免每半小时一个 commit 淹没历史，也避免并发任务互相 non-fast-forward
      - name: Assemble site bundle
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/feed.js site/data/
          cp .nojekyll site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
